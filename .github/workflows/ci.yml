name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: "3.12"
          version: "0.12.13"
      - name: Install the locked environment
        run: uv sync --locked --group dev
      - name: Validate the lock without network resolution
        run: uv lock --check --offline
      - name: Lint
        run: uv run ruff check src/trace2flow tests streamlit_app.py
      - name: Test
        env:
          PYTHONPATH: src
          PREFECT_SERVER_ALLOW_EPHEMERAL_MODE: "true"
        run: uv run python -m unittest discover -s tests -v
      - name: Compile Python sources
        env:
          PYTHONPATH: src
        run: uv run python -m compileall -q src tests streamlit_app.py
